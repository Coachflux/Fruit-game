plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getEnvOrDefault = { String name, String fallback ->
    def value = System.getenv(name)
    return value != null && !value.trim().isEmpty() ? value.trim() : fallback
}

/*
 * AdMob configuration.
 *
 * GitHub Actions can provide real production IDs through environment
 * variables. The Google test IDs below are used as safe fallbacks.
 */
def admobAppId = getEnvOrDefault(
        "ADMOB_APP_ID",
        "ca-app-pub-3940256099942544~3347511713"
)

def bannerAdUnitId = getEnvOrDefault(
        "BANNER_AD_UNIT_ID",
        "ca-app-pub-3940256099942544/6300978111"
)

def interstitialAdUnitId = getEnvOrDefault(
        "INTERSTITIAL_AD_UNIT_ID",
        "ca-app-pub-3940256099942544/1033173712"
)

def rewardedAdUnitId = getEnvOrDefault(
        "REWARDED_AD_UNIT_ID",
        "ca-app-pub-3940256099942544/5224354917"
)

android {
    /*
     * Namespace used by the Android source code.
     *
     * This does NOT need to be the same as applicationId.
     */
    namespace 'io.github.coachflux.fruitfusion'

    /*
     * Google Play currently requires the app to target API 36.
     */
    compileSdk 36

    defaultConfig {
        /*
         * IMPORTANT:
         * This MUST match the existing Google Play Console app.
         */
        applicationId 'io.github.coachflux.twa'

        minSdk 24
        targetSdk 36

        versionCode 2
        versionName '1.0.1'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        /*
         * AdMob IDs
         */
        buildConfigField 'String', 'ADMOB_APP_ID', "\"${admobAppId}\""
        buildConfigField 'String', 'BANNER_AD_UNIT_ID', "\"${bannerAdUnitId}\""
        buildConfigField 'String', 'INTERSTITIAL_AD_UNIT_ID', "\"${interstitialAdUnitId}\""
        buildConfigField 'String', 'REWARDED_AD_UNIT_ID', "\"${rewardedAdUnitId}\""

        manifestPlaceholders = [
                ADMOB_APP_ID: admobAppId
        ]
    }

    /*
     * Release signing configuration.
     *
     * GitHub Actions creates the keystore file from the Base64
     * GitHub Secret before Gradle runs.
     */
    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH')
            def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('KEY_ALIAS')
            def keyPasswordValue = System.getenv('KEY_PASSWORD')

            if (!keystorePath ||
                    !keystorePassword ||
                    !keyAliasValue ||
                    !keyPasswordValue ||
                    !file(keystorePath).exists()) {

                throw new GradleException(
                        "Release signing configuration is missing or the keystore file does not exist."
                )
            }

            storeFile file(keystorePath)
            storePassword keystorePassword
            keyAlias keyAliasValue
            keyPassword keyPasswordValue
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }

        release {
            minifyEnabled false
            shrinkResources false

            /*
             * Force the release APK/AAB to be signed.
             */
            signingConfig signingConfigs.release

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'

    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    implementation 'androidx.activity:activity-ktx:1.9.1'
}
