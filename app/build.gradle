plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.coachflux.fruitfusion'
    compileSdk 35

    // Allow overriding AdMob IDs from local.properties or environment variables (for production / CI).
    // Priority: environment variable > local.properties > Google test IDs.
    // Example local.properties:
    //   ADMOB_APP_ID=ca-app-pub-xxxxxxxx~yyyyyyyy
    //   BANNER_AD_UNIT_ID=ca-app-pub-xxxxxxxx/zzzzzzzz
    //   etc.
    def localProps = new Properties()
    def localPropsFile = rootProject.file('local.properties')
    if (localPropsFile.exists()) {
        localProps.load(new FileInputStream(localPropsFile))
    }
    def resolve = { String key, String fallback ->
        System.getenv(key) ?: localProps.getProperty(key) ?: fallback
    }

    defaultConfig {
        applicationId "io.github.coachflux.fruitfusion"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // AdMob IDs — defaults to Google's official TEST IDs for safe development.
        // Override via local.properties or environment variables for production.
        def appId = resolve('ADMOB_APP_ID', 'ca-app-pub-3940256099942544~3347511713')
        def bannerId = resolve('BANNER_AD_UNIT_ID', 'ca-app-pub-3940256099942544/6300978111')
        def interstitialId = resolve('INTERSTITIAL_AD_UNIT_ID', 'ca-app-pub-3940256099942544/1033173712')
        def rewardedId = resolve('REWARDED_AD_UNIT_ID', 'ca-app-pub-3940256099942544/5224354917')

        buildConfigField "String", "ADMOB_APP_ID", "\"${appId}\""
        buildConfigField "String", "BANNER_AD_UNIT_ID", "\"${bannerId}\""
        buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", "\"${interstitialId}\""
        buildConfigField "String", "REWARDED_AD_UNIT_ID", "\"${rewardedId}\""
        manifestPlaceholders = [ADMOB_APP_ID: appId]
    }

    signingConfigs {
        release {
            // Populated from environment / GitHub Secrets at build time.
            // Do NOT hard-code passwords or keystore paths in source control.
            def envKeystorePath = System.getenv("KEYSTORE_PATH") ?: System.getenv("ANDROID_KEYSTORE_PATH")
            def envKeystorePassword = System.getenv("KEYSTORE_PASSWORD")
            def envKeyAlias = System.getenv("KEY_ALIAS")
            def envKeyPassword = System.getenv("KEY_PASSWORD")

            if (envKeystorePath && envKeystorePassword && envKeyAlias && envKeyPassword) {
                storeFile file(envKeystorePath)
                storePassword envKeystorePassword
                keyAlias envKeyAlias
                keyPassword envKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            // Uses test AdMob IDs from defaultConfig
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        buildConfig true
        viewBinding true
    }
    // Ensure assets are packaged correctly
    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'

    // Official Google Mobile Ads SDK (AdMob)
    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    // Optional: for better WebView lifecycle handling
    implementation 'androidx.activity:activity-ktx:1.9.1'
}
