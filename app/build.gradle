plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def getEnvOrDefault = { String name, String fallback ->
    def value = System.getenv(name)
    return value != null && !value.trim().isEmpty() ? value.trim() : fallback
}

def admobAppId = getEnvOrDefault(
        "ADMOB_APP_ID",
        "ca-app-pub-3940256099942544~3347511713"
)

def bannerAdUnitId = getEnvOrDefault(
        "BANNER_AD_UNIT_ID",
        "ca-app-pub-3940256099942544/6300978111"
)

def interstitialAdUnitId = getEnvOrDefault(
        "INTERSTITIAL_AD_UNIT_ID",
        "ca-app-pub-3940256099942544/1033173712"
)

def rewardedAdUnitId = getEnvOrDefault(
        "REWARDED_AD_UNIT_ID",
        "ca-app-pub-3940256099942544/5224354917"
)

android {
    namespace 'io.github.coachflux.fruitfusion'
    compileSdk 35

    defaultConfig {
        applicationId 'io.github.coachflux.fruitfusion'

        minSdk 24
        targetSdk 35

        versionCode 1
        versionName '1.0.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        buildConfigField 'String', 'ADMOB_APP_ID', "\"${admobAppId}\""
        buildConfigField 'String', 'BANNER_AD_UNIT_ID', "\"${bannerAdUnitId}\""
        buildConfigField 'String', 'INTERSTITIAL_AD_UNIT_ID', "\"${interstitialAdUnitId}\""
        buildConfigField 'String', 'REWARDED_AD_UNIT_ID', "\"${rewardedAdUnitId}\""

        manifestPlaceholders = [
                ADMOB_APP_ID: admobAppId
        ]
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv('KEYSTORE_PATH')
            def keystorePassword = System.getenv('KEYSTORE_PASSWORD')
            def keyAliasValue = System.getenv('KEY_ALIAS')
            def keyPasswordValue = System.getenv('KEY_PASSWORD')

            if (keystorePath &&
                    keystorePassword &&
                    keyAliasValue &&
                    keyPasswordValue &&
                    file(keystorePath).exists()) {

                storeFile file(keystorePath)
                storePassword keystorePassword
                keyAlias keyAliasValue
                keyPassword keyPasswordValue
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            debuggable true
        }

        release {
            minifyEnabled false
            shrinkResources false

            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }

            proguardFiles(
                    getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
            )
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packaging {
        resources {
            excludes += [
                    'META-INF/DEPENDENCIES',
                    'META-INF/LICENSE*',
                    'META-INF/NOTICE*'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'

    implementation 'com.google.android.gms:play-services-ads:23.3.0'

    implementation 'androidx.activity:activity-ktx:1.9.1'
}
