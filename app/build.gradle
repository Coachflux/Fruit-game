plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'io.github.coachflux.fruitfusion'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.coachflux.fruitfusion"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Google test AdMob IDs
        buildConfigField "String", "ADMOB_APP_ID", '"ca-app-pub-3940256099942544\~3347511713"'
        buildConfigField "String", "BANNER_AD_UNIT_ID", '"ca-app-pub-3940256099942544/6300978111"'
        buildConfigField "String", "INTERSTITIAL_AD_UNIT_ID", '"ca-app-pub-3940256099942544/1033173712"'
        buildConfigField "String", "REWARDED_AD_UNIT_ID", '"ca-app-pub-3940256099942544/5224354917"'

        manifestPlaceholders = [ADMOB_APP_ID: "ca-app-pub-3940256099942544\~3347511713"]
    }

    signingConfigs {
        release {
            def ksPath = System.getenv("KEYSTORE_PATH")
            def ksPassword = System.getenv("KEYSTORE_PASSWORD")
            def kAlias = System.getenv("KEY_ALIAS")
            def kPassword = System.getenv("KEY_PASSWORD")

            if (ksPath != null && file(ksPath).exists()
                    && ksPassword != null && !ksPassword.isEmpty()
                    && kAlias != null && !kAlias.isEmpty()
                    && kPassword != null && !kPassword.isEmpty()) {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias kAlias
                keyPassword kPassword
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // Keep minify OFF until everything builds cleanly
            minifyEnabled false
            shrinkResources false

            def ksPath = System.getenv("KEYSTORE_PATH")
            if (ksPath != null && file(ksPath).exists()) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.webkit:webkit:1.11.0'
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
    implementation 'androidx.activity:activity-ktx:1.9.1'
}
