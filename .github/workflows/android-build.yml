name: Fruit Fusion Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Signed Android APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "$ANDROID_SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_SDK_ROOT/build-tools/36.0.0" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK 36
        run: |
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Decode release keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "ERROR: ANDROID_KEYSTORE_BASE64 GitHub Secret is missing."
            exit 1
          fi

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/fruitfusion-release.jks"

          if [ ! -s "$RUNNER_TEMP/fruitfusion-release.jks" ]; then
            echo "ERROR: Keystore file was not created correctly."
            exit 1
          fi

          echo "Keystore successfully decoded."

      - name: Configure release signing
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "ERROR: KEYSTORE_PASSWORD GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$KEY_ALIAS" ]; then
            echo "ERROR: KEY_ALIAS GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$KEY_PASSWORD" ]; then
            echo "ERROR: KEY_PASSWORD GitHub Secret is missing."
            exit 1
          fi

          echo "KEYSTORE_PATH=$RUNNER_TEMP/fruitfusion-release.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"

      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          keytool -list \
            -keystore "$RUNNER_TEMP/fruitfusion-release.jks" \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Clean project
        run: ./gradlew clean

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Signed Release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Verify release APK
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Release APK was not found."
            exit 1
          fi

          echo "Release APK:"
          ls -lh "$APK"

          echo "Verifying APK signature..."
          apksigner verify --verbose "$APK"

      - name: Verify release AAB
        run: |
          AAB=$(find app/build/outputs/bundle/release -type f -name "*.aab" | head -n 1)

          if [ -z "$AAB" ]; then
            echo "ERROR: Release AAB was not found."
            exit 1
          fi

          echo "Release AAB:"
          ls -lh "$AAB"

      - name: Verify package name
        run: |
          APK=$(find app/build/outputs/apk/release -type f -name "*.apk" | head -n 1)

          echo "Checking APK package/application ID..."

          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt" dump badging "$APK" | head -n 1

      - name: Show build outputs
        run: |
          echo "======================================"
          echo "DEBUG APK"
          echo "======================================"
          find app/build/outputs/apk/debug \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          echo ""
          echo "======================================"
          echo "RELEASE APK"
          echo "======================================"
          find app/build/outputs/apk/release \
            -type f \
            -name "*.apk" \
            -exec ls -lh {} \;

          echo ""
          echo "======================================"
          echo "RELEASE AAB"
          echo "======================================"
          find app/build/outputs/bundle/release \
            -type f \
            -name "*.aab" \
            -exec ls -lh {} \;

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fruit-Fusion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fruit-Fusion-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload Signed Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Fruit-Fusion-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
