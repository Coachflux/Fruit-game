name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    name: Build APK and AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d -i > keystore.jks
          SIZE=$(stat -c%s keystore.jks)
          echo "Decoded keystore size: $SIZE bytes"
          echo "Decoded keystore sha256: $(sha256sum keystore.jks | cut -d' ' -f1)"
          if [ ! -s keystore.jks ]; then
            echo "ERROR: keystore.jks is empty. Check that the ANDROID_KEYSTORE_BASE64 secret is set correctly."
            exit 1
          fi
          echo "KEYSTORE_PATH=$(pwd)/keystore.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$(printf '%s' "${{ secrets.KEYSTORE_PASSWORD }}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" >> $GITHUB_ENV
          echo "KEY_ALIAS=$(printf '%s' "${{ secrets.KEY_ALIAS }}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$(printf '%s' "${{ secrets.KEY_PASSWORD }}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" >> $GITHUB_ENV

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Build Release AAB
        run: ./gradlew bundleRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Fruit-Fusion-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Fruit-Fusion-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Release AAB
        uses: actions/upload-artifact@v4
        with:
          name: Fruit-Fusion-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
